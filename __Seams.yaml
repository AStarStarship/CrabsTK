# __Seams.yaml — ROOT: module list (build-up order).
#
# Hierarchical seams schema: this file lists MODULES, not seams. Each
# module carries its own seam list at <folder>/__Seams.yaml (the legacy
# seams: schema). Global numbering = module order x module-seam order;
# seam names stay stable, numbers are regenerated by reordering (the one
# sanctioned renumber). Release is the terminal module, always last.
#
#   folder:  path (relative to this file's directory) to the module's seam
#            directory. Default: _Seams/<name>. Covers sibling (../X),
#            parent-sibling-child (../../Y/Z), and child (Sub/W) layouts.
#   dormant: true -> the module is numbered and scaffolded but excluded
#            from the rollup (its code does not compile yet).
#
# Regenerate: python3 Hatch/SyncSeams.py __Seams.yaml
#
# Order: ASCIICrabs first (the core-types foundation, seam 1), then the
# working-first pins (Data, IPC, Math, Who), then the remainder in
# alphabetical order, Pro dormant at the end, Release terminal.

project: CrabsTK
mode: crabstk
release_module: Release

modules:
  - name: ASCIICrabs
    label: "ASCIICrabs core (sibling package via _Config.h)"
  - name: Data
    label: "Data module"
  - name: IPC
    folder: IPC/_Seams
    label: "IPC module (code + seams in IPC/)"
  - name: Math
    folder: Math/_Seams
    label: "Math module (code in Math/)"
  - name: Who
    label: "Who module"
  - name: Audio
  - name: Code
  - name: Env
  - name: Forms
  - name: GUI
  - name: Hatch
  - name: Image
  - name: IMUL
  - name: Plot
  - name: Touch
  - name: Web
  - name: Pro
    dormant: true
  - name: Release
